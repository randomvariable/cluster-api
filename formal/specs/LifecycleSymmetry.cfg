\* TLC configuration for LifecycleSymmetry.tla with SYMMETRY enabled.
\*
\* Use a 5-machine model (5! = 120x reduction) and admit two
\* concurrent remediations. The .nosymmetry.cfg companion runs the
\* same model without SYMMETRY for the state-count comparison.

CONSTANTS
    Machines      = {m1, m2, m3, m4, m5}
    MaxConcurrent = 2

CHECK_DEADLOCK FALSE

SPECIFICATION Spec

SYMMETRY MachineSymmetry

INVARIANTS
    AllSafetyInvariants
    InFlightBounded
    NoConcurrentQuorumLoss
    PhaseConsistent
