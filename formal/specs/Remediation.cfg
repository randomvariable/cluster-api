\* TLC configuration for Remediation.tla.
\*
\* Bound the model to three Machines and one concurrent remediation
\* — the smallest configuration that still exercises the
\* NoConcurrentQuorumLoss invariant non-trivially.

CONSTANTS
    Machines      = {m1, m2, m3}
    MaxConcurrent = 1

\* The terminal state — every Machine completed — has no enabled
\* Next action. TLC treats absent Next-enabledness as a deadlock,
\* which is not what we mean here: the spec is finite and
\* monotonically terminating. Suppress the deadlock check.
CHECK_DEADLOCK FALSE

SPECIFICATION Spec

INVARIANTS
    AllSafetyInvariants
    QueuesDisjoint
    InFlightCappedByMax
    AtMostOneRemediationPerMachine
    NoConcurrentQuorumLoss

\* MonotonicProgress is a liveness obligation; uncomment when
\* fairness assumptions are added to Spec.
\* PROPERTY MonotonicProgress
