\* TLC configuration for RemediationCAS.tla.
\*
\* Bound the model to two Machines and three live voter slots —
\* the smallest configuration that still distinguishes:
\*   * concurrent-removal CAS aborts (voterCount can drop), and
\*   * learner-promotion CAS aborts (learners can flip).

CONSTANTS
    Machines  = {m1, m2}
    MaxVoters = 3

\* The spec is a finite handshake; once every Machine is in
\* rpcDone or aborted, no Next action is enabled and the
\* live-state actions saturate. TLC would call that a deadlock,
\* which is not what we mean.
CHECK_DEADLOCK FALSE

SPECIFICATION Spec

INVARIANTS
    AllRefinementInvariants
    DomainsDisjoint
    GateAndCommitObserveConsistentState
    EveryRemoveMemberHasMatchingValidCommitAdmission
